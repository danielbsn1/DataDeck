name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  api:
    name: API — build e imagem Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run build
      # sem suíte de testes ainda — trocar por `npm test` quando existir

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker (só valida, não publica)
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false

  web:
    name: Web — lint, build e imagem Docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-dataDeck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-dataDeck/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker (só valida, não publica)
        uses: docker/build-push-action@v6
        with:
          context: ui-dataDeck
          push: false

  publish:
    name: Publicar imagens no GHCR
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/datadeck-api:latest
            ghcr.io/${{ github.repository_owner }}/datadeck-api:${{ github.sha }}

      - name: Build + push da imagem do Web
        uses: docker/build-push-action@v6
        with:
          context: ui-dataDeck
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/datadeck-web:latest
            ghcr.io/${{ github.repository_owner }}/datadeck-web:${{ github.sha }}
